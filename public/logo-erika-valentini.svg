<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ec4899" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Magenta/Pink Circle Accent around 'erika' -->
  <circle
    cx="74"
    cy="62"
    r="44"
    fill="none"
    stroke="url(#pinkGrad)"
    stroke-width="11"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Brand Typography: erika -->
  <text
    x="68"
    y="60"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="44"
    font-weight="800"
    letter-spacing="-1.5"
    fill="#ffffff"
  >
    erika
  </text>

  <!-- Brand Typography: valentini -->
  <text
    x="74"
    y="108"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="46"
    font-weight="800"
    letter-spacing="-1.5"
    fill="#ffffff"
  >
    valentini
  </text>

  <!-- Flowing Hair Swoosh wave above slogan -->
  <path
    d="M 175 118 Q 235 110 320 120"
    fill="none"
    stroke="#cbd5e1"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.6"
  />

  <!-- Slogan: estilo en tus cabellos -->
  <text
    x="180"
    y="136"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="16"
    font-weight="400"
    letter-spacing="0.5"
    fill="#f472b6"
  >
    estilo en tus cabellos
  </text>
</svg>
